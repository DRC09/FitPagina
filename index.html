<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-primary" href="#">FitTrack</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="estadisticas.html">Estadísticas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="perfil.html">Perfil</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="hero-section text-center mb-5">
            <h1 class="display-4 fw-bold mb-3">FitTrack</h1>
            <p class="lead text-muted">Tu compañero personal para un estilo de vida saludable</p>
        </div>
        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h3 class="mb-3">Ejercicios Disponibles</h3>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Ejercicio</th>
                                        <th>Calorías por minuto</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla_ejercicios" class="table-group-divider">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h3 class="section-title">Registrar Actividad</h3>
                        <form id="formulario_actividad">
                            <div class="mb-3">
                                <label class="form-label">Ejercicio</label>
                                <select id="ejercicio_actividad" class="form-control" required>
                                    <option value="">Selecciona ejercicio</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Duración (minutos)</label>
                                <input id="duracion_actividad" class="form-control" type="number" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Calorías estimadas</label>
                                <input id="calorias_estimadas" class="form-control" type="number" readonly>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Registrar Actividad</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h3 class="section-title">Actividades Registradas</h3>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Ejercicio</th>
                                        <th>Duración</th>
                                        <th>Calorías</th>
                                        <th>Fecha</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla_actividades" class="table-group-divider">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center my-4">
            <button onclick="reiniciarDatos()" class="btn btn-outline-danger">Reiniciar Datos</button>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
