<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Rutina - FitPagina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header class="bg-dark text-white p-3 text-center">
    <h1>Registrar Rutina</h1>
    <nav>
      <a href="index.html" class="text-white mx-2">Inicio</a>
      <a href="registrar.html" class="text-white mx-2">Registrar</a>
      <a href="historial.html" class="text-white mx-2">Historial</a>
    </nav>
  </header>
  <main class="container mt-4">
    <form id="form-rutina">
      <div class="mb-3">
        <label for="nombre" class="form-label">Ejercicio</label>
        <input type="text" class="form-control" id="nombre" required>
      </div>
      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo</label>
        <select id="tipo" class="form-select" required>
          <option value="fuerza">Fuerza</option>
          <option value="cardio">Cardio</option>
          <option value="movilidad">Movilidad</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="duracion" class="form-label">Duración (minutos)</label>
        <input type="number" class="form-control" id="duracion" required>
      </div>
      <button type="submit" class="btn btn-success">Guardar rutina</button>
    </form>
  </main>
  <script src="js/registrar.js"></script>
</body>
</html>
