    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Mi Perfil</h3>
                        <form id="form-perfil">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre-perfil" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Peso (kg)</label>
                                <input type="number" class="form-control" id="peso-perfil" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Perfil</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
